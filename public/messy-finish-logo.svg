<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Organic "Splash" Background -->
  <g opacity="0.7">
    <ellipse cx="60" cy="60" rx="50" ry="30" fill="#ff007f" transform="rotate(-20 60 60)" />
    <ellipse cx="140" cy="70" rx="40" ry="60" fill="#8a2be2" transform="rotate(15 140 70)" />
    <ellipse cx="100" cy="140" rx="70" ry="40" fill="#00bfff" transform="rotate(-10 100 140)" />
    <ellipse cx="160" cy="130" rx="30" ry="50" fill="#ff00ff" transform="rotate(30 160 130)" />
  </g>

  <!-- MF Ligature -->
  <path d="M50,140 L75,60 L100,110 L125,60 L150,140"
        stroke="#000000" stroke-width="18" fill="none" stroke-linejoin="round" stroke-linecap="round" />

  <!-- F bars extending from the right slash of the M -->
  <path d="M125,60 L165,60"
        stroke="#000000" stroke-width="18" fill="none" stroke-linecap="round" />
  <path d="M137,100 L155,100"
        stroke="#000000" stroke-width="18" fill="none" stroke-linecap="round" />
</svg>