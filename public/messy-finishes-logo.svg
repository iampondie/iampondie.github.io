<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background: The "Finish" (Clean Geometric) -->
  <rect x="40" y="40" width="120" height="120" fill="#000000" />

  <!-- The "Messy" (Organic Plaster Smear) -->
  <path d="M20,100 Q60,80 100,110 T180,90" stroke="#ff4f00" stroke-width="12" fill="none" stroke-linecap="round" />
  <path d="M30,110 Q70,90 110,120 T190,100" stroke="#ff4f00" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Minimal Detail: A small white highlight for texture -->
  <path d="M60,95 Q70,92 80,98" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" />
</svg>