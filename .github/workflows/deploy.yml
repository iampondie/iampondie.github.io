name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload site
        uses: withastro/action@v2
        with:
          path: . # Adjust if the site is in a sub-folder, but here it is the root of the repo if we move it.
          # Wait, the project is in 'personal-site/'.
          # If the user creates a repo for this, the files will be at the root.
          # I will assume for the workflow that the files are at the root of the target repo.
          # But in the current local setup, they are in 'personal-site/'.
          # I'll write the workflow assuming the repo root IS the project root.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
